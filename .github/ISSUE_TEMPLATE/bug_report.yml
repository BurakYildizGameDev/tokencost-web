name: Bug report
description: Something is calculated, parsed or displayed incorrectly.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Sample input
      description: A few rows of the pasted table or the file type you used. Remove anything sensitive — issues are public.
      render: text
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 141 on Windows 11
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options: [Türkçe, English, Deutsch, 中文, Español]
